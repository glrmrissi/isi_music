# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all targets and features
all-features = true
no-default-features = false

[advisories]
# Fail the build on advisories
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore these advisories (with reasons)
ignore = [
    # rsa: Marvin Attack timing sidechannel. No patched version exists (issue still open
    # upstream, RustCrypto/RSA#626). librespot-core uses RsaPublicKey::verify only (signature
    # verification of Spotify's server key), never private-key operations or decryption.
    # The Marvin Attack recovers private keys via timing on decrypt operations not applicable
    # to signature verification. Risk is effectively zero for this use case.
    "RUSTSEC-2023-0071",
]
unmaintained = "workspace"

[licenses]
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    # Permissive licenses used by dependencies
    "BSL-1.0",     # Boost Software License (clipboard-win, error-code)
    "MPL-2.0",     # Mozilla Public License 2.0 (symphonia, mpris-server, option-ext)
    "CDLA-Permissive-2.0", # Community Data License Agreement (webpki-roots cert bundle)
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Licenses not in the allow list above are denied by default (no `deny` key needed)

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Warn on wildcard dependencies
wildcards = "warn"
# Highlight crates that are allowed but not recommended
highlight = "all"
# Skip (allow) specific crates that have multiple versions (common in large trees)
# These are tolerated duplicates, not a whitelist of allowed crates
skip = [
    { name = "windows-sys", version = "*" },
    { name = "windows", version = "*" },
    { name = "windows-core", version = "*" },
    { name = "windows-targets", version = "*" },
    { name = "windows-implement", version = "*" },
    { name = "windows-interface", version = "*" },
    { name = "windows-link", version = "*" },
    { name = "windows-result", version = "*" },
    { name = "windows-strings", version = "*" },
    { name = "windows_aarch64_gnullvm", version = "*" },
    { name = "windows_aarch64_msvc", version = "*" },
    { name = "windows_i686_gnu", version = "*" },
    { name = "windows_i686_gnullvm", version = "*" },
    { name = "windows_i686_msvc", version = "*" },
    { name = "windows_x86_64_msvc", version = "*" },
    { name = "windows_x86_64_gnu", version = "*" },
    { name = "windows_x86_64_gnullvm", version = "*" },
    { name = "hashbrown", version = "*" },
    { name = "bitflags", version = "*" },
    { name = "getrandom", version = "*" },
    { name = "rand", version = "*" },
    { name = "rand_core", version = "*" },
    { name = "rand_chacha", version = "*" },
    { name = "thiserror", version = "*" },
    { name = "thiserror-impl", version = "*" },
    { name = "syn", version = "*" },
    { name = "rustix", version = "*" },
    { name = "linux-raw-sys", version = "*" },
    { name = "r-efi", version = "*" },
    { name = "uuid", version = "*" },
    { name = "webpki-roots", version = "*" },
]

[sources]
# Only allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Deny git dependencies (except our local patch)
allow-git = []
