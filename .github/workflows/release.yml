name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Validate semantic version
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must follow semantic versioning: v1.2.3"
            exit 1
          fi
          echo "Tag format valid: ${{ github.ref_name }}"

      - name: Extract version from tag
        id: extract
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  deny:
    name: Cargo Deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --all-features --locked check

  test:
    name: Test
    needs: deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set credentials for build
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> $GITHUB_ENV
          echo "LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}" >> $GITHUB_ENV
        shell: bash

      - name: Test (default features)
        run: cargo test --locked --verbose

      - name: Test (minimal features)
        run: cargo test --locked --no-default-features -F spotify,discord --verbose

      - name: Remove generated secrets from target
        shell: bash
        run: find target/ -name "secrets.rs" -delete 2>/dev/null || true

  build:
    name: Build (${{ matrix.label }})
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: isi-music
            asset_name: isi-music-linux-x86_64

          - os: ubuntu-latest
            label: Linux ARM64
            target: aarch64-unknown-linux-gnu
            artifact_name: isi-music
            asset_name: isi-music-linux-arm64

          - os: windows-latest
            label: Windows x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: isi-music.exe
            asset_name: isi-music-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libssl-dev

      - name: Install ARM64 cross-compile dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list.d/*.list 2>/dev/null || true
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^URIs:/Architectures: amd64\nURIs:/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libasound2-dev:arm64 \
            libc6-dev:arm64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set credentials for build
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> $GITHUB_ENV
          echo "LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}" >> $GITHUB_ENV
        shell: bash

      - name: Set ARM64 cross-compile environment
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> $GITHUB_ENV

      - name: Build full binary
        shell: bash
        env:
          OPENSSL_STATIC: 1
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            -F mpris \
            --verbose && \
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
             "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-full"

      - name: Build minimal binary
        shell: bash
        env:
          OPENSSL_STATIC: 1
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --no-default-features \
            -F spotify,discord \
            --verbose && \
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
             "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-minimal"

      - name: Remove generated secrets from target
        shell: bash
        run: find target/ -name "secrets.rs" -delete 2>/dev/null || true

      - name: Create release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts

          FULL_PATH="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-full"
          MINIMAL_PATH="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-minimal"

          if [ -f "$FULL_PATH" ]; then
            cp "$FULL_PATH" "release-artifacts/${{ matrix.asset_name }}"
            echo "Artifact ready: ${{ matrix.asset_name }}"
          else
            echo "Binary not found at: $FULL_PATH"
            exit 1
          fi

          if [ -f "$MINIMAL_PATH" ]; then
            cp "$MINIMAL_PATH" "release-artifacts/${{ matrix.asset_name }}-minimal"
            echo "Artifact ready: ${{ matrix.asset_name }}-minimal"
          else
            echo "Minimal binary not found at: $MINIMAL_PATH"
            exit 1
          fi

          # Package Linux binaries as tar.gz for Homebrew compatibility
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mkdir -p tarball-full tarball-minimal
            cp "$FULL_PATH" "tarball-full/${{ matrix.artifact_name }}"
            cp "$MINIMAL_PATH" "tarball-minimal/${{ matrix.artifact_name }}"
            tar czf "release-artifacts/${{ matrix.asset_name }}.tar.gz" -C tarball-full .
            tar czf "release-artifacts/${{ matrix.asset_name }}-minimal.tar.gz" -C tarball-minimal .
            echo "Tarball ready: ${{ matrix.asset_name }}.tar.gz"
            echo "Tarball ready: ${{ matrix.asset_name }}-minimal.tar.gz"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git cliff \
            --tag "${{ github.ref_name }}" \
            --config cliff.toml \
            --current \
            -o changelog-full.md

      - name: Build release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.ref_name }}"^ 2>/dev/null || echo "")
          COMMIT_COUNT=$(git rev-list --count "${{ github.ref_name }}" ^"${PREVIOUS_TAG:-$(git rev-list --max-parents=0 HEAD)}" 2>/dev/null || echo "")

          cat > release-notes.md <<- RELEASE
          ## ${{ github.ref_name }}

          $(if [ -n "$COMMIT_COUNT" ]; then echo "**$COMMIT_COUNT commits**"; fi)$(if [ -n "$PREVIOUS_TAG" ]; then echo " since $PREVIOUS_TAG"; fi)

          $(if [ -n "$PREVIOUS_TAG" ]; then echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ github.ref_name }}"; fi)

          ---

          <details>
          <summary>View changelog</summary>

          RELEASE

          cat changelog-full.md >> release-notes.md

          echo "</details>" >> release-notes.md
          echo "=== Release Notes ==="
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        run: |
          echo "Artifacts downloaded:"
          ls -lh artifacts/

          if [ -z "$(ls -A artifacts/)" ]; then
            echo "No artifacts found"
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > ../checksums.sha256
          cd ..
          mv checksums.sha256 artifacts/
          echo "Checksums:"
          cat artifacts/checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: success()
        run: |
          echo "Release ${{ github.ref_name }} created successfully!"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [create-release, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: glrmrissi/homebrew-isi-music
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download Linux x86_64 tarball
        uses: actions/download-artifact@v4
        with:
          name: isi-music-linux-x86_64
          path: artifacts

      - name: Download Linux ARM64 tarball
        uses: actions/download-artifact@v4
        with:
          name: isi-music-linux-arm64
          path: artifacts

      - name: Compute SHA256 checksums
        id: sha
        run: |
          X86_SHA=$(sha256sum artifacts/isi-music-linux-x86_64.tar.gz | awk '{print $1}')
          ARM_SHA=$(sha256sum artifacts/isi-music-linux-arm64.tar.gz | awk '{print $1}')
          echo "x86_sha=$X86_SHA" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p Formula
          cat > Formula/isi-music.rb << FORMULA
          class IsiMusic < Formula
            desc "Terminal music player for Spotify streaming and local file playback"
            homepage "https://github.com/glrmrissi/isi_music"
            version "${VERSION}"

            on_linux do
              on_arm do
                url "https://github.com/glrmrissi/isi_music/releases/download/v${VERSION}/isi-music-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.arm_sha }}"
              end
              on_intel do
                url "https://github.com/glrmrissi/isi_music/releases/download/v${VERSION}/isi-music-linux-x86_64.tar.gz"
                sha256 "${{ steps.sha.outputs.x86_sha }}"
              end
            end

            def install
              bin.install "isi-music"
            end

            test do
              assert_match "isi-music v", shell_output("#{bin}/isi-music --version")
            end
          end
          FORMULA

      - name: Commit and push formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/isi-music.rb
          git commit -m "Update isi-music formula to v${{ needs.validate.outputs.version }}"
          git push
