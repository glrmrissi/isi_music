[package]
name = "isi-music"
version = "1.3.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "isi-music"
path = "src/main.rs"

[patch.crates-io]
librespot-core = { path = "patches/librespot-core" }

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Spotify API
chrono = "0.4"

# Spotify Connect / native audio
librespot-core = "0.8"
librespot-playback = { version = "0.8", features = ["rodio-backend"] }

# Local audio playback (MP3, FLAC)
rodio = { version = "0.21", features = ["symphonia-mp3", "symphonia-flac"] }
symphonia = { version = "0.5", features = ["mp3", "flac"] }

# Opus local playback: Ogg demux + libopus (bundled, built via cmake)
ogg = "0.9"
opus2 = { version = "0.4", features = ["bundled"] }
opusmeta = "3"

# .env support (desenvolvimento)
dotenvy = "0.15"

# sqllite support
rusqlite = { version = "0.31", features = ["bundled"] }

# URL parsing (OAuth callback)
url = "2"

# Diretórios XDG (config/cache do usuário)
dirs = "5"

# Config file
toml = "0.8"

# HTTP client (used for Spotify search API directly)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MD5 (Last.fm API signature)
md5 = "0.7"

# Open URLs in default browser
open = "5"

# Clipboard support
arboard = "3.4"

# RNG (shuffle)
rand = "0.8"

# FFT for audio visualizer
rustfft = "6"

# OS memory management
libc = "0.2"

# Image processing (album art)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

# Image rendering in terminal (kitty/sixel/halfblocks auto-detection)
ratatui-image = { version = "9", default-features = false, features = ["crossterm"], optional = true }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MPRIS2 D-Bus integration (Waybar, playerctl, media keys)
mpris-server = { version = "0.8", optional = true }

# Discord Rich Presence
discord-rich-presence = { version = "0.2", optional = true }

# PKCE OAuth (SHA256 + base64url)
sha2 = "0.10"
base64 = { version = "0.22", default-features = false }

# Compile-time credential encryption (ChaCha20-Poly1305)
chacha20poly1305 = "0.10"

# Encoding
urlencoding = "2.1.3"

# Unicode display width for correct TUI rendering
unicode-width = "0.2"

metaflac = "0.2.8"

id3 = "1.16.4"

# Buffer
ringbuf = "0.5.0"

# Windows path normalization (avoids \\?\ prefix)
dunce = "1.0"

# Wizard (setup/config prompts)
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console   = "0.15"

# Filesystem watcher (theme/keybinds hot-reload)
notify = "7"

# Global media hotkeys + native toasts + SMTC (Windows)
[target.'cfg(windows)'.dependencies]
global-hotkey = "0.6.4"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Media", "Media_Playback", "Storage_Streams", "Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
dotenvy = "0.15"
chacha20poly1305 = "0.10"
rand = "0.8"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = true

[features]
mpris = ["mpris-server"]
discord = ["discord-rich-presence"]
album-art = ["image", "ratatui-image"]
default = ["discord", "spotify", "album-art"]
spotify = []
